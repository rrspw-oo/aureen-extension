<body><main><div class="kicker">科學週報</div><h1>睡眠如何塑造記憶</h1><div class="by">閱讀時間 8 分鐘</div>
<p id="p1">在深層睡眠時，海馬迴會重播白天的經歷，並把它們轉存到大腦皮質，成為長期記憶。研究人員已經在老鼠和人類身上觀察到這種重播。</p>
<p id="p2">在一項研究中，學習後有睡覺的受試者，比整晚沒睡的人多記住了兩成的單字配對，而兩組的讀書時間完全相同。</p>
<p id="p3">睡前一小時學的內容效果最明顯，代表時間點和睡眠長度一樣重要。小睡也有幫助，只要不超過三十分鐘。</p>
<p id="p4">這不代表可以不用讀書，而是讀書之後的那一晚，本身就是讀書的一部分。</p>
</main></body></html>
